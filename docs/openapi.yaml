openapi: 3.0.3
info:
  title: LinkForge API
  version: 0.1.1
  description: |
    API создаёт короткие ссылки, перенаправляет по ним и показывает число переходов.
    Ответы с данными приходят в JSON, ошибки — обычным текстом.
servers:
  - url: http://localhost:8080
    description: Адрес API при запуске на компьютере
tags:
  - name: Сервис
  - name: Ссылки
paths:
  /healthz:
    get:
      tags: [Сервис]
      summary: Проверить, что сервер отвечает
      description: Показывает работу HTTP-сервера. Подключение к базе и кешу не проверяется.
      operationId: healthz
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/links:
    post:
      tags: [Ссылки]
      summary: Создать короткую ссылку
      operationId: createLink
      description: |
        Передай один JSON-объект с единственным полем url в нижнем регистре.
        Повторяющиеся поля, лишние поля и данные после объекта отклоняются.
        В url нужен полный HTTP/HTTPS-адрес; пробелы по краям убираются.
        Адрес должен укладываться в 4096 байт, всё тело запроса — в 16 КиБ.
        С одного IP можно отправить 10 запросов за 60 секунд; ошибочные тоже считаются.
        Если на сервере задана CREATE_LINK_API_KEY, добавь её значение в X-API-Key.
        Без этой настройки ключ не нужен.
      security:
        - {}
        - CreateLinkApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            example:
              url: https://example.com/article
      responses:
        '201':
          description: Ссылка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLinkResponse'
              example:
                code: aB23cdEf
                short_url: http://localhost:8080/aB23cdEf
                original_url: https://example.com/article
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '401':
          description: Нужен верный X-API-Key, поскольку на сервере задана CREATE_LINK_API_KEY
          content:
            text/plain:
              schema:
                type: string
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          description: С этого IP уже отправлено слишком много запросов на создание ссылок
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Лимитер не может обработать новый IP-адрес, например когда заполнен список адресов
          headers:
            Retry-After:
              description: Через сколько секунд повторить запрос
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
  /api/v1/links/{code}/stats:
    get:
      tags: [Ссылки]
      summary: Посмотреть число переходов
      operationId: getLinkStats
      description: Доступна без ключа. Повторные переходы и боты тоже считаются.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '200':
          description: Код ссылки и число переходов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStats'
              example:
                code: aB23cdEf
                click_count: 3
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /{code}:
    get:
      tags: [Ссылки]
      summary: Открыть исходную ссылку
      operationId: redirectLink
      description: |
        Возвращает 302 и исходный адрес в заголовке Location.
        Если сохранить счётчик не удалось, переход всё равно сработает.
        Браузер обычно открывает адрес сам; поведение других клиентов зависит от их настроек.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '302':
          description: Можно перейти по адресу из Location
          headers:
            Location:
              description: Исходный URL
              required: true
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    CreateLinkApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Передавай ключ, если на сервере задана CREATE_LINK_API_KEY.
  parameters:
    Code:
      name: code
      in: path
      description: Код короткой ссылки
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8
        pattern: '^[a-zA-Z0-9]{8}$'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateLinkRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: Полный HTTP/HTTPS-адрес длиной до 4096 байт; длину проверяет сервер
          example: https://example.com/article
    CreateLinkResponse:
      type: object
      required: [code, short_url, original_url]
      properties:
        code:
          type: string
          description: Случайный код длиной 8 символов
          minLength: 8
          maxLength: 8
          pattern: '^[a-zA-Z0-9]{8}$'
        short_url:
          type: string
          format: uri
        original_url:
          type: string
          format: uri
    LinkStats:
      type: object
      required: [code, click_count]
      properties:
        code:
          type: string
        click_count:
          type: integer
          format: int64
          minimum: 0
  responses:
    BadRequest:
      description: Проверь JSON и адрес в поле url
      content:
        text/plain:
          schema:
            type: string
    RequestTooLarge:
      description: Тело запроса превышает 16 КиБ
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Ссылки с таким кодом нет
      content:
        text/plain:
          schema:
            type: string
    MethodNotAllowed:
      description: Для этого адреса нужен другой HTTP-метод
      headers:
        Allow:
          description: Какой HTTP-метод можно использовать
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: На сервере произошла ошибка; подробности есть в логах
      content:
        text/plain:
          schema:
            type: string
