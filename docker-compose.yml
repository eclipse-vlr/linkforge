services:
  api:
    build: .
    image: linkforge:local
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      BASE_URL: "http://localhost:8080"
      DATABASE_URL: "postgres://linkforge:devpassword@db:5432/linkforge?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      CREATE_LINK_API_KEY: "${CREATE_LINK_API_KEY:-}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stop_grace_period: 15s

  db:
    image: postgres:17-alpine
    container_name: linkforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: linkforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
