name: HTTP benchmark

on:
  push:
    branches: [master]
    paths:
      - "cmd/loadtest/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: linkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://linkforge:devpassword@127.0.0.1:5432/linkforge?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      BASE_URL: http://127.0.0.1:8080
      HTTP_ADDR: 127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build API and load tester
        run: |
          go build -o /tmp/linkforge ./cmd/api
          go build -o /tmp/linkforge-loadtest ./cmd/loadtest
      - name: Run bounded load test (real API, local PostgreSQL and Redis)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/linkforge > /tmp/linkforge-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/linkforge-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/linkforge-server.log
            exit 1
          fi
          /tmp/linkforge-loadtest -base http://127.0.0.1:8080 -requests 500 -workers 10 -out benchmark-report.json
          cat benchmark-report.json
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkforge-benchmark
          path: benchmark-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linkforge-benchmark-server-logs
          path: /tmp/linkforge-server.log
          if-no-files-found: warn
          retention-days: 7
