
name: Go CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: linkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://linkforge:devpassword@localhost:5432/linkforge?sslmode=disable
      TEST_DATABASE_URL: postgres://linkforge:devpassword@localhost:5432/linkforge?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          CREATE_LINK_API_KEY: ci-inherited-test-key
        run: go test -race -count=1 -v ./...

      - name: Test release uploader
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -O -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run go vet
        run: go vet ./...

      - name: Check dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build release Docker image
        run: docker build --pull -t linkforge:ci .

      - name: Test Docker image, migrations and API
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:18080:8090 \
            -e PORT=8090 \
            -e BASE_URL=http://127.0.0.1:18080 \
            -e DATABASE_URL='postgres://linkforge:devpassword@host.docker.internal:5432/linkforge?sslmode=disable' \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            -e CREATE_LINK_API_KEY=ci-smoke-test-key \
            linkforge:ci)
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != true ]; then
              exit 1
            fi

            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/healthz
          test "$(docker exec "$container_id" id -u)" -ne 0

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/api/v1/links \
            -H "Content-Type: application/json" \
            -d '{"url":"https://example.com"}')
          test "$status" = 401

          created=$(curl -fsS \
            -X POST http://127.0.0.1:18080/api/v1/links \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ci-smoke-test-key" \
            -d '{"url":"https://example.com"}')
          code=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])' <<< "$created")
          status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/$code")
          test "$status" = 302
          curl -fsS "http://127.0.0.1:18080/api/v1/links/$code/stats" \
            | python3 -c 'import json,sys; count=json.load(sys.stdin)["click_count"]; sys.exit(0 if count == 1 else "Expected click_count=1")'
          docker stop --time 15 "$container_id" > /dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' "$container_id")" = 0
